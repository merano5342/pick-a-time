const HITS=[[4.32,4,9],[16.55,6,9],[20.15,4,10]];
const handEnv=t=>sstep(0.05,0.4,t)*(1-sstep(9.3,9.6,t)) + sstep(10.85,11.2,t)*(1-sstep(17.4,17.8,t));
function camAt(t){
  const c=OM.camera(t,KEYS), e=handEnv(t)*3.2;
  let x=c.x+e*(Math.sin(1.7*t)+0.6*Math.sin(2.9*t+1))/c.zoom, y=c.y+e*(Math.sin(1.3*t+2)+0.5*Math.sin(3.3*t))/c.zoom, rot=c.rot;
  for(const [th,amp,decay] of HITS){ const s=OM.shake(t,th,{amp,decay,seed:Math.round(th*100)}); x+=s.x/c.zoom; y+=s.y/c.zoom; rot+=s.rot*0.4; }
  return {x,y,zoom:c.zoom,rot};
}

// ════════════════════════════ map (canvas, world coordinates) ════════════════════════════
const G=$('ground').getContext('2d');
const hsh=(a,b)=>{ let h=(a*374761393+b*668265263)|0; h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296; };
const RIVER=[[-900,2050],[600,1820],[1500,2150],[2600,1900],[3600,2050],[4800,1750]];
// link routes host → friends, and restaurant → everyone: quadratic curves through a bend
const route=(a,b,bend)=>{ const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
  return {a,b,c:{x:mx-dy/L*bend, y:my+dx/L*bend}}; };
const qpt=(R,u)=>({x:(1-u)*(1-u)*R.a.x+2*(1-u)*u*R.c.x+u*u*R.b.x, y:(1-u)*(1-u)*R.a.y+2*(1-u)*u*R.c.y+u*u*R.b.y});
const phoneTop=k=>({x:PEOPLE[k].x, y:PEOPLE[k].y-PH/2+40});
const LINK_R=[0,1,2].map(k=>route({x:PEOPLE[HOST].x,y:PEOPLE[HOST].y-PH/2-70},phoneTop(k),[-260,220,180][k]));
const FOOD_R=[0,1,2,3].map(k=>route({x:HUB.x,y:HUB.y},phoneTop(k),[120,-120,-120,120][k]));
function drawRoute(R,u0,u1,alpha,col,w){ if(alpha<=0.003||u1<=u0) return; G.save(); G.globalAlpha=alpha; G.strokeStyle=col; G.lineWidth=w; G.lineCap='round'; G.setLineDash([w*0.1,w*2.1]);
  G.beginPath(); const N=48; for(let i=0;i<=N;i++){ const p=qpt(R,lerp(u0,u1,i/N)); i?G.lineTo(p.x,p.y):G.moveTo(p.x,p.y);} G.stroke(); G.restore(); }
function ground(t,VIEW,dim){
  G.setTransform(2,0,0,2,0,0); G.fillStyle='#FFF8ED'; G.fillRect(0,0,1920,1080);
  const M=VIEW.map((v,i)=>v*2); G.setTransform(...M);
  const C=[[0,0],[1920,0],[0,1080],[1920,1080]].map(p=>OM.unproject(VIEW,p[0],p[1]));
  const x0=Math.min(...C.map(p=>p[0]))-300, x1=Math.max(...C.map(p=>p[0]))+300, y0=Math.min(...C.map(p=>p[1]))-300, y1=Math.max(...C.map(p=>p[1]))+300;
  const A=1-dim*0.7;
  // river
  G.save(); G.globalAlpha=A; G.strokeStyle='#E6EEEC'; G.lineWidth=170; G.lineCap='round'; G.lineJoin='round'; G.beginPath();
  RIVER.forEach((p,i)=>{ if(!i) G.moveTo(p[0],p[1]); else { const q=RIVER[i-1]; G.quadraticCurveTo(q[0]+(p[0]-q[0])*0.5, q[1], (q[0]+p[0])/2,(q[1]+p[1])/2); } }); G.stroke(); G.restore();
  // blocks
  const SX=300, SY=250;
  for(let gx=Math.floor(x0/SX);gx*SX<x1;gx++) for(let gy=Math.floor(y0/SY);gy*SY<y1;gy++){
    const h=hsh(gx+50,gy+50), wide=(gx%4===0?26:0), wideY=(gy%3===0?24:0);
    const bx=gx*SX+16+wide, by=gy*SY+16+wideY, bw=SX-32-wide, bh=SY-32-wideY;
    const cy=by+bh/2; let riverY=1950; if(Math.abs(cy-riverY)<150) continue;
    G.globalAlpha=A; G.fillStyle=h<0.12?'#E9EFDB':h<0.55?'#F6EADB':'#F2E3CF';
    rr(bx,by,bw,bh,18); G.fill();
    if(h>0.7){ G.fillStyle='#EFDDC6'; rr(bx+bw*0.12,by+bh*0.18,bw*0.34,bh*0.5,10); G.fill(); }
  }
  G.globalAlpha=1;
  // routes
  LINK_R.forEach((R,k)=>{ const u=ease.cubicInOut(seg(t,T.ROUTE0+k*0.06,T.ROUTE1+k*0.06)); drawRoute(R,0,u,(1-sstep(5.0,5.6,t))*0.9,'#e06828',16); });
  FOOD_R.forEach((R,k)=>{ const u=ease.cubicInOut(seg(t,T.NOTIFY+k*0.07,T.NOTIFY+0.6+k*0.07)); drawRoute(R,0,u,(1-sstep(T.FOLD0,T.FOLD0+0.4,t))*0.9,'#e06828',16); });
  // vote trails, faint, under the flying answers
  DOTS.forEach(D=>{ const g=seg(t,D.t0,D.t0+DOT_D); if(g<=0||t>D.t0+DOT_D+0.5) return; });
  G.setTransform(2,0,0,2,0,0);
  const v=G.createRadialGradient(960,540,520,960,540,1250); v.addColorStop(0,'rgba(224,104,40,0)'); v.addColorStop(1,'rgba(224,104,40,0.07)');
  G.fillStyle=v; G.fillRect(0,0,1920,1080);
}
function rr(x,y,w,h,r){ G.beginPath(); G.moveTo(x+r,y); G.arcTo(x+w,y,x+w,y+h,r); G.arcTo(x+w,y+h,x,y+h,r); G.arcTo(x,y+h,x,y,r); G.arcTo(x,y,x+w,y,r); G.closePath(); }

function put(e,x,y,s=1,op=1,extra=''){ if(op<0.002){ e.style.display='none'; return; } e.style.display=''; e.style.opacity=fx(op); e.style.transform=`translate(${fx(x)}px,${fx(y)}px) scale(${s.toFixed(4)})${extra}`; }
function show(e,on){ e.style.display=on?'':'none'; }
function slideIn(t,t0,d=0.42){ return ease.expoOut(seg(t,t0,t0+d)); }
function cardXf(t){ const p=OM.popIn(t,T.CARD_IN,{zeta:0.7,omega:15,rise:110,s0:0.88,ds:0.12}); return {x:CARD.x+CARD.w*(1-p.s)/2, y:CARD.y+p.dy+CARD.h*(1-p.s)/2, s:p.s, op:t<T.CARD_IN?0:p.op}; }

function drawFinger(o,F,t){ // o: phone; F list for that phone

  if(!best){ o.finger.style.display='none'; return; }
  const a=best.path[0].t, b=best.path[best.path.length-1].t, v=sstep(a,a+0.18,t)*(1-sstep(b-0.22,b,t));
  const p=spline(best.path,t); let s=1; for(const [c] of best.taps){ const d=t-c; if(d>=0&&d<0.12) s=0.82; }

}
function drawRipple(o,F,t){ let last=null; for(const f of F) for(const [c,x,y] of f.taps) if(t>=c&&(!last||c>last[0])) last=[c,x,y];
  const ra=last?seg(t,last[0],last[0]+0.38):1; if(ra>=1){ o.rip.style.display='none'; return; }

// ════════════════════════════ contract ════════════════════════════
window.__seek=async t=>{ await seek(t); return true; };
window.__track=t=>{ seek(t); const o={}; for(const [k,b] of Object.entries(TRACK)) o[k]=OM.projectBox(VIEW,b); return o; };
window.__motion=(t0,t1)=>{ let d=OM.screenTravel(camAt(t0),camAt(t1),camAt((t0+t1)/2));
  const a=window.__track(t0), b=window.__track(t1);
  for(const k of Object.keys(a)){ if(!b[k]) continue; const p=a[k], q=b[k]; d=Math.max(d,Math.abs(p.x-q.x),Math.abs(p.y-q.y),Math.abs(p.x+p.w-q.x-q.w),Math.abs(p.y+p.h-q.y-q.h)); }
  seek(t1); return d; };
window.__events=()=>{ const E=[];
  E.push({t:T.TITLE_TAP,kind:'tap'}); for(let i=0;i<TITLE.length;i++) E.push({t:T.TYPE0+i/T.CPS,kind:'key'});
  T.DATES.forEach(t=>E.push({t,kind:'date'})); E.push({t:T.GO,kind:'go'},{t:T.PILL1,kind:'lift'},{t:T.ROUTE0,kind:'route'});
  [0,1,2].forEach(k=>E.push({t:T.IRIS+k*0.06,kind:'open',k}));
  TAPS.forEach((tp,k)=>{ tp.tap.forEach((t,r)=>E.push({t,kind:'vote',k,s:PEOPLE[k].v[r]})); E.push({t:tp.sub,kind:'send',k}); });
  DOTS.forEach(D=>E.push({t:D.t0+DOT_D,kind:'drop',j:D.j,s:D.s}));
  E.push({t:T.BEST,kind:'best'},{t:T.CHIP0,kind:'chip'},{t:T.CHIP1,kind:'final'},{t:T.AIBTN,kind:'tap'});
  T.CHIPS.forEach(t=>E.push({t,kind:'chiptap'})); E.push({t:T.START,kind:'tap'},{t:T.THINK,kind:'think'},{t:T.RESULTS,kind:'results'},{t:T.PICK,kind:'pick'},
    {t:T.PIN1,kind:'pinhop'},{t:T.PINLAND,kind:'pinland'});
  [0,1,2,3].forEach(k=>E.push({t:T.NOTIFY+0.55+k*0.07,kind:'notify',k}));
  E.push({t:T.FOLD0,kind:'fold'},{t:T.FOLD1,kind:'seal'}); markL.forEach((s,i)=>E.push({t:T.MARK+i*0.07+0.06,kind:'letter'})); E.push({t:T.TAG,kind:'tag'});
  return E.sort((a,b)=>a.t-b.t); };
window.__ready=document.fonts.ready.then(()=>seek(0));
const q=new URLSearchParams(location.search);
if(q.has('t')) __ready.then(()=>seek(parseFloat(q.get('t'))));
if(q.has('hud')) $('hud').style.display='block';
if(q.has('play')) __ready.then(()=>{const t0=performance.now();(function loop(){seek(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();});
</script>
