  { const pref=$('pref'), th=$('think'), res=$('res'), toThink=ssstep(T.THINK,T.THINK+0.3,t), toRes=ssstep(T.RESULTS,T.RESULTS+0.25,t);

// ════════════════════════════ contract ════════════════════════════
window.__seek=async t=>{ await seek(t); return true; };
window.__track=t=>{ seek(t); const o={}; for(const [k,b] of Object.entries(TRACK)) o[k]=OM.projectBox(VIEW,b); return o; };
window.__motion=(t0,t1)=>{ let d=OM.screenTravel(camAt(t0),camAt(t1),camAt((t0+t1)/2));
  const a=window.__track(t0), b=window.__track(t1);

  seek(t1); return d; };
const WID={};
window.__ready=document.fonts.ready.then(()=>{ [['b1',bub1],['b2',bub2],['lab',$('pinlab')]].forEach(([k,e])=>{ e.style.display=''; WID[k]=e.offsetWidth; }); return seek(0); });

if(q.has('t')) __ready.then(()=>seek(parseFloat(q.get('t'))));
