<body>

<script>
// ══════════════════════════════════════════════════════════════════════════════════════════════
// timeline (seconds) — one take, carried by the camera, the link and the votes
//  0.00–2.30  close on the laptop: title types, three dates clicked          快速建立

window.__meta={dur:DUR,fps:30,w:1920,h:1080,
  inFrame:{pill:[3.05,4.3], card:[8.4,10.95,'whole'], mark:[12.2,15,'whole']}};
const {clamp,lerp,seg,sstep,ssstep,spring,ring,spline,ease}=OM;

  U:c=>`<svg viewBox="0 0 20 20"><path d="M4 4 L16 16 M16 4 L4 16" stroke="${c}" stroke-width="2.8" stroke-linecap="round"/></svg>`,
  link:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>`,
  cal:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>`,
};
const VCOL={A:'#5A9E5A', I:'#F59E0B', U:'#9B8870'};

// ════════════════════════════ geometry (world px) ════════════════════════════
const LAP={x:120,y:170,s:0.75};                               // laptop replica: local 1280×800 → world
const lapW=(lx,ly)=>({x:LAP.x+lx*LAP.s, y:LAP.y+ly*LAP.s});
const CELL=(r,c)=>({x:64+c*101.71+50.86, y:366+r*62+31});      // calendar cell centre, laptop-local
const DATES=[{r:1,c:0,d:'2026-10-04',w:'週日'},{r:1,c:1,d:'2026-10-05',w:'週一'},{r:2,c:0,d:'2026-10-11',w:'週日'}];
const TITLE_C=lapW(420,204), GO_L={x:856,y:700,w:360,h:56}, GO_W={x:LAP.x+GO_L.x*.75,y:LAP.y+GO_L.y*.75,w:GO_L.w*.75,h:GO_L.h*.75};

const PS=0.8, PH={w:375*PS,h:812*PS};
const PX=i=>1560+i*340, PY=215;
const ROWY=[400,470,572];                                      // vote rows' button centre y, phone-local
const BTNX={A:230,I:280,U:330};                                // button centre x, phone-local (row left 14 + offsets)
const SUB_C={x:187,y:758};

const CARD={x:1770,y:270,w:900,h:560};
const BADGE={x:1900,y:448,w:150,h:150,r:38};

// ════════════════════════════ beats ════════════════════════════
const T={ TYPE0:0.45, CPS:14, DCLK:[1.38,1.72,2.06], GO:2.95, MORPH0:3.0, MORPH1:3.32, HOP1:4.25,
  SPLIT1:4.58, IRIS:4.52, IRIS_D:0.5, CARD_IN:7.55, RECEDE0:7.7, RECEDE1:8.35, BEST:9.25, FOLD0:11.0, FOLD1:11.75,
  MARK:11.55, TAG:12.05 };
const TAPS=[ // per phone: three answer taps, then 送出
  {tap:[5.30,5.58,5.86], sub:6.30},
  {tap:[5.45,5.80,6.10], sub:6.62},
  {tap:[5.55,5.92,6.30], sub:6.85},
  {tap:[5.38,5.70,6.18], sub:6.98},
];
// the answers fly: phone k, row r leaves at LAUNCH(k,r), lands DOT_D later
const LAUNCH=(k,r)=>7.62+k*0.12+r*0.05, DOT_D=0.62;

// ════════════════════════════ build: laptop replica ════════════════════════════
const app=$('app');
app.innerHTML=`
 <div class="a hdr"><div class="logo">${SVG.cal}</div><div class="nm">揪甘心</div><div class="sb">聚會時間協調神器</div><div class="av">王</div></div>
 <div class="a cardL">
   <div class="lab" style="left:24px;top:22px;font-size:19px">基本活動資訊</div>
   <div class="lab" style="left:24px;top:62px">活動 / 聚會名稱 <b>*</b></div>

    DOTS.forEach(D=>{ const tl=D.t0+DOT_D; const on=t>=tl; const key=D.j+D.s; landed[key]=(landed[key]||0)+(on?1:0);
      const sk=on?spring(t-tl,0.55,22):0; D.seg.style.transform=`scaleX(${sk.toFixed(4)})`; });
    PEOPLE.forEach((P,k)=>{ if(t>=Math.max(...SLOTS.map((S,r)=>LAUNCH(k,r)))+DOT_D) full++; });
    rkEls.forEach((el,j)=>{ ['A','I','U'].forEach(s=>{ el.querySelector('.c'+s).textContent=landed[j+s]||0; }); });
    $('cnt').textContent=`共 ${full} 人已回覆`;
    // the best slot: a ring that hugs it, and its tag
    const b=$('best'), bw=OM.popIn(t,T.BEST+0.08,{zeta:0.55,omega:20,rise:10,s0:0.6,ds:0.4});
    b.style.opacity=t<T.BEST+0.08?0:fx(bw.op); b.style.transform=`translateY(${fx(bw.dy)}px) scale(${bw.s.toFixed(3)})`;
    const gl=$('glow'), gk=t<T.BEST?0:spring(t-T.BEST,0.6,18), gout=1-sstep(T.FOLD0-0.1,T.FOLD0+0.15,t);
    if(gk<=0||gout<=0){ gl.style.display='none'; } else { const cc=cardXf(t), pad=lerp(26,8,gk);
      const x=cc.x+(30-pad)*cc.s, y=cc.y+(RK_TOP-pad)*cc.s, w=(840+2*pad)*cc.s, h=(136+2*pad)*cc.s;
      gl.style.display=''; gl.style.width=fx(w)+'px'; gl.style.height=fx(h)+'px'; put(gl,x,y,1,Math.min(1,gk*1.4)*gout); }
  }

  // ── the answers fly from each phone into the ranking ──
  let dbox=null;
  DOTS.forEach(D=>{ const e=D.el, t1=D.t0+DOT_D;
    if(t<D.t0||t>=t1+0.12||t>=T.FOLD0){ e.style.display='none'; return; }
    const from=phoneW(D.k,D.t0,BTNX[D.s],ROWY[D.r]), to=segW(t,D.j,D.q);
    const g=OM.gather(t,D.t0,t1,0,1,from,to,{stagger:0,arc:90+D.k*14,curve:ease.cubicInOut});
    const land=seg(t,t1,t1+0.12), s=(0.8+0.25*Math.sin(Math.PI*Math.min(1,g.k)))*(1-land);
    e.style.display=''; e.style.opacity=fx(1-land); e.style.transform=`translate(${fx(g.x)}px,${fx(g.y)}px) scale(${s.toFixed(3)})`;
    const bx={x:g.x-20,y:g.y-20,w:40,h:40}; dbox=dbox?{x:Math.min(dbox.x,bx.x),y:Math.min(dbox.y,bx.y),x2:Math.max(dbox.x+dbox.w,bx.x+40),y2:Math.max(dbox.y+dbox.h,bx.y+40)}:{...bx,x2:bx.x+40,y2:bx.y+40};
    if(dbox){ dbox.w=dbox.x2-dbox.x; dbox.h=dbox.y2-dbox.y; } });
  if(dbox) TRACK.dots={x:dbox.x,y:dbox.y,w:dbox.w,h:dbox.h};

  // ── lockup ──
  { const bd=$('badge'), on=t>=T.FOLD1;
    if(on){ const im=OM.impact(t,T.FOLD1,{decay:7,omega:20,sqx:0.1,sqy:0.12});
      bd.style.display=''; bd.style.width=BADGE.w+'px'; bd.style.height=BADGE.h+'px';
      bd.style.transform=`translate(${BADGE.x+BADGE.w*(1-im.sx)/2}px,${BADGE.y+BADGE.h*(1-im.sy)}px) scale(${im.sx.toFixed(4)},${im.sy.toFixed(4)})`;
      bd.querySelector('svg').style.opacity=1; bd.querySelector('svg').style.transform=`scale(${fx(0.6+0.4*spring(t-T.FOLD1,0.5,22))})`;
    } else if(t>=T.FOLD0){ bd.style.display='none'; } else bd.style.display='none';
    markL.forEach((s,i)=>{ const d=OM.letterDrop(t,T.MARK,i,{stagger:0.07,dist:60});
      s.style.opacity=t<T.MARK?0:fx(d.op); s.style.transform=`translateY(${fx(d.y)}px) scale(${d.sx.toFixed(4)},${d.sy.toFixed(4)})`; });
    tagS.forEach((s,i)=>{ const w=OM.wordRise(t,T.TAG+i*0.16,{dist:22}); s.style.opacity=t<T.TAG?0:fx(w.op); s.style.transform=`translateY(${fx(w.y)}px)`; });
    $('tag').querySelectorAll('i').forEach((e,i)=>{ e.style.opacity=fx(sstep(T.TAG+0.1+i*0.16,T.TAG+0.3+i*0.16,t)); });
    $('mark').style.display=t<T.MARK?'none':''; $('tag').style.display=t<T.TAG?'none':'';
    if(t>=T.MARK) TRACK.mark={x:BADGE.x,y:BADGE.y-10,w:2090+470-BADGE.x,h:170};
  }

  // ── screen space: the cursor, the caption ──
  { const cu=OM.cursor(t,HAND,CLICKS), p=OM.project(VIEW,cu.x,cu.y), vis=sstep(0.05,0.25,t)*(1-sstep(3.2,3.45,t));
    const el=$('cursor'); el.style.display=vis<0.01?'none':''; el.style.opacity=fx(vis); el.style.transform=`translate(${fx(p[0]-4)}px,${fx(p[1]-3)}px) scale(${cu.s})`;
    if(vis>0.01) TRACK.hand={x:p[0],y:p[1],w:30,h:40}; }
  { const ci=OM.popIn(t,CAPS[0].t-0.05,{rise:24}), co=ssstep(CAP_OUT+0.1,CAP_OUT+0.45,t), cp=$('cap');
    cp.style.display=(t<CAPS[0].t-0.05||co>=1)?'none':''; cp.style.opacity=fx(ci.op*(1-co)); cp.style.transform=`translateY(${fx(ci.dy+co*30)}px)`; }
  capEls.forEach((el,i)=>{ const c=CAPS[i], nx=CAPS[i+1];
    const kin=spring(t-c.t,0.62,18), kout=nx?ssstep(nx.t-0.05,nx.t+0.25,t):ssstep(CAP_OUT,CAP_OUT+0.35,t);
    const y=(1-kin)*120 - kout*120; const vis=t>=c.t&&kout<1;
    el.style.display=vis?'':'none'; el.style.transform=`translateY(${fx(y)}px)`; el.style.opacity=fx(Math.min(1,kin*1.4)*(1-kout)); });

  $('hud').textContent='t='+t.toFixed(3);
  return Promise.resolve();
}

// ════════════════════════════ contract ════════════════════════════
window.__seek=async t=>{ await seek(t); return true; };
window.__track=t=>{ seek(t); const M=VIEW, o={};
  for(const [k,b] of Object.entries(TRACK)) o[k]= k==='hand'?b:OM.projectBox(M,b);
  return o; };
window.__motion=(t0,t1)=>{
  const tm=(t0+t1)/2; let d=OM.screenTravel(camAt(t0),camAt(t1),camAt(tm));
  const a=window.__track(t0), b=window.__track(t1);
  for(const k of Object.keys(a)){ if(!b[k]) continue; const p=a[k], q=b[k];
    d=Math.max(d,Math.abs(p.x-q.x),Math.abs(p.y-q.y),Math.abs(p.x+p.w-q.x-q.w),Math.abs(p.y+p.h-q.y-q.h)); }
  seek(t1); return d; };
window.__events=()=>{ const E=[];
  CLICKS.forEach((c,i)=>E.push({t:c,kind:i===0?'focus':i===CLICKS.length-1?'go':'date'}));
  for(let i=0;i<TITLE.length;i++) E.push({t:T.TYPE0+i/T.CPS,kind:'key'});
  E.push({t:T.MORPH1,kind:'lift'},{t:T.HOP1,kind:'land'});
  [0,1,2,3].forEach(k=>E.push({t:T.IRIS+k*0.05,kind:'open',pan:-0.6+k*0.4}));
  TAPS.forEach((tp,k)=>{ tp.tap.forEach((c,r)=>E.push({t:c,kind:'vote',s:PEOPLE[k].v[r],pan:-0.6+k*0.4})); E.push({t:tp.sub,kind:'send',pan:-0.6+k*0.4}); });
  DOTS.forEach(D=>E.push({t:D.t0+DOT_D,kind:'drop',s:D.s,j:D.j,pan:(D.q-1.5)*0.2}));
  E.push({t:T.BEST,kind:'best'},{t:T.FOLD0,kind:'fold'},{t:T.FOLD1,kind:'seal'});
  markL.forEach((s,i)=>E.push({t:T.MARK+i*0.07+0.06,kind:'letter',i}));
  E.push({t:T.TAG,kind:'tag'});
  return E.sort((a,b)=>a.t-b.t); };
window.__ready=document.fonts.ready.then(()=>seek(0));
const q=new URLSearchParams(location.search);
if(q.has('t')) __ready.then(()=>seek(parseFloat(q.get('t'))));
if(q.has('hud')) $('hud').style.display='block';
if(q.has('play')) __ready.then(()=>{const t0=performance.now();(function loop(){seek(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();});
</script>
